<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><style>text{font-family:Arial;fill:#172033}.b{fill:white;stroke:#49627a;stroke-width:2;rx:12}.z{fill:#f6f9fc;stroke:#567;stroke-width:2;rx:18}.h{font-size:25px;font-weight:700}.s{font-size:17px}.t{font-size:21px;font-weight:700}</style><text x="40" y="45" class="h">AWS Lab Overview — Secure Architecture + Threat Detection</text><rect x="35" y="75" width="545" height="620" class="z"/><text x="60" y="112" class="h">Architecture</text><text x="60" y="145" class="s">Internet → IGW → public ALB → private app → private RDS</text><rect x="70" y="180" width="475" height="115" class="b"/><text x="90" y="215" class="t">Public tier</text><text x="90" y="250" class="s">10.0.1.0/24 · 10.0.2.0/24 · ALB HTTP/80</text><rect x="70" y="320" width="475" height="145" class="b"/><text x="90" y="355" class="t">Private application tier</text><text x="90" y="390" class="s">10.0.11.0/24 · 10.0.12.0/24</text><text x="90" y="425" class="s">EC2 :8080 · SSM / Secrets Manager endpoints</text><rect x="70" y="490" width="475" height="145" class="b"/><text x="90" y="525" class="t">Private database tier</text><text x="90" y="560" class="s">10.0.21.0/24 · 10.0.22.0/24</text><text x="90" y="595" class="s">RDS MySQL :3306 · encrypted · not public</text><rect x="620" y="75" width="545" height="620" class="z"/><text x="645" y="112" class="h">Detection &amp; Response</text><text x="645" y="150" class="s">AuthorizeSecurityGroupIngress → CloudTrail</text><rect x="660" y="190" width="465" height="105" class="b"/><text x="680" y="225" class="t">CloudTrail</text><text x="680" y="260" class="s">fin-lab-trail → versioned S3 log bucket</text><rect x="660" y="320" width="465" height="105" class="b"/><text x="680" y="355" class="t">EventBridge + Lambda</text><text x="680" y="390" class="s">Detect internet-open security group ingress</text><rect x="660" y="450" width="465" height="185" class="b"/><text x="680" y="485" class="t">Finding + response runbook</text><text x="680" y="520" class="s">HIGH finding in CloudWatch Logs</text><text x="680" y="555" class="s">Triage → contain → preserve evidence</text><text x="680" y="590" class="s">Escalate suspicious actor activity</text></svg>